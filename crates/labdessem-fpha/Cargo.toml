[package]
name = "labdessem-fpha"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "FPHA fitting pipeline with qhull convex hull"

[dependencies]
labdessem-core = { path = "../labdessem-core" }
labdessem-io = { path = "../labdessem-io" }
labdessem-model = { path = "../labdessem-model" }
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
labdessem-core = { path = "../labdessem-core", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
