[package]
name = "labdessem-fpha"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "FPHA fitting pipeline with qhull convex hull"

[dependencies]
labdessem-core = { path = "../labdessem-core" }
thiserror = "2"
log = "0.4"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1.2"

# Cannot use workspace lints because FFI requires unsafe code.
# Copy workspace lints with unsafe_code = "allow" instead of "forbid".
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
float_cmp = "allow"
return_self_not_must_use = "allow"
implicit_hasher = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
similar_names = "allow"
too_many_lines = "allow"
type_complexity = "allow"
format_push_string = "allow"
clone_on_ref_ptr = "allow"
