[workspace]
members = [
    "crates/labdessem-cli",
    "crates/labdessem-core",
    "crates/labdessem-io",
    "crates/labdessem-model",
    "crates/labdessem-simulation",
    "crates/labdessem-solver"
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
authors = ["Carlos Ribeiro <carlosribeiro121201@gmail.com>"]
license = "MIT"
repository = "https://github.com/carlosribeiro06/labdessem_rust"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
